# Settings to include on the production PostgreSQL server (postgresql.conf: include 'postgresql.hub.conf').
# Needs the pgaudit extension installed; see docs/GO_LIVE.md.
ssl = on                                  # clients connect with sslmode=verify-full
password_encryption = scram-sha-256
shared_preload_libraries = 'pgaudit,pg_stat_statements'
pgaudit.log = 'ddl, role, write'          # every schema, role and data change is logged
pgaudit.log_relation = on
log_connections = on
log_disconnections = on
log_min_duration_statement = 500          # slow queries
# Point-in-time recovery: continuous WAL archive to storage that cannot be altered or deleted (S3 Object Lock)
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'     # or pgBackRest: pgbackrest --stanza=hub archive-push %p
archive_timeout = 300
max_wal_senders = 5                       # for a streaming replica
